plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Loom сам добавляет репозитории Minecraft и Fabric.
	// Mod Menu (необязательная зависимость — экран настроек)
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

dependencies {
	// Версии задаются в gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API — даёт события (тики, вход в мир) и клиентские команды
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu — только для компиляции экрана настроек; в игре мод работает и без него
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	// Подставляем версию из gradle.properties в fabric.mod.json
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// ---------------------------------------------------------------------------
//  Аддон «Артефакты» — отдельный jar (artifact-addon-<версия>.jar).
//
//  Исходники живут в src/artifactAddon, компилируются вместе с основным модом
//  (чтобы использовать его API — dev.dedworkshop.twitchcraft.api) и упаковываются
//  в собственный файл мода с точкой входа "twitchcraft-addon".
//  В игре аддон можно ставить отдельно от TwitchCraft: он подключается сам,
//  если TwitchCraft установлен, и объявлен как его зависимость.
// ---------------------------------------------------------------------------
sourceSets {
	artifactAddon {
		java.srcDirs = ['src/artifactAddon/java']
		resources.srcDirs = ['src/artifactAddon/resources']
		compileClasspath += sourceSets.main.output + configurations.compileClasspath
		runtimeClasspath += output + compileClasspath
	}
}

tasks.named('processArtifactAddonResources', ProcessResources).configure {
	inputs.property "version", project.addon_version
	filesMatching('fabric.mod.json') {
		expand "version": project.addon_version
	}
}

// Сначала обычный jar из классов аддона, затем remap: имена Minecraft внутри аддона
// переводятся из именованных (как при компиляции) в intermediary — иначе в игре
// аддон не найдёт классы. Именно поэтому используется RemapJarTask из Loom.
tasks.register('artifactAddonRawJar', Jar) {
	group = 'build'
	description = 'Промежуточный (не remap) jar аддона «Артефакты»'
	archiveBaseName.set('artifact-addon')
	archiveVersion.set(project.addon_version)
	archiveClassifier.set('raw')
	destinationDirectory.set(layout.buildDirectory.dir('libs/raw'))
	from sourceSets.artifactAddon.output
	dependsOn tasks.named('artifactAddonClasses')
}

tasks.register('artifactAddonJar', net.fabricmc.loom.task.RemapJarTask) {
	group = 'build'
	description = 'Собирает аддон «Артефакты» в отдельный jar'
	dependsOn tasks.named('artifactAddonRawJar')
	archiveBaseName.set('artifact-addon')
	archiveVersion.set(project.addon_version)
	archiveClassifier.set('')
	inputFile.set(tasks.named('artifactAddonRawJar').flatMap { it.archiveFile })
	classpath.setFrom(sourceSets.artifactAddon.compileClasspath)
	addNestedDependencies.set(false)
}

tasks.named('build') {
	dependsOn tasks.named('artifactAddonJar')
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
